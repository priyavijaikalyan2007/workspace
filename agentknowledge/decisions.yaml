[
    {
        "id": "ADR-001",
        "title": "Isolate retained instruction tests from consuming-project state",
        "date": "2026-11-01",
        "status": "Accepted",
        "context": "The inherited tests assumed the source instruction repository's identity, origin, and history. A consuming repository must validate retained tools without restoring unrelated records or weakening source-protection assertions.",
        "files": [
            "scripts/tests/fixture_library.py",
            "scripts/tests/fixtures/instruction-profile.md"
        ]
    },
    {
        "id": "ADR-002",
        "title": "Use native macOS development and native Ubuntu validation",
        "date": "2026-11-02",
        "status": "Accepted",
        "context": "The user rejects container development. Thin Bash 3.2 wrappers delegate to pinned Node/TypeScript functions. A controlled fixture validates artifact mechanics without inventing Markdown features. Unconfigured production and remote operations fail before work. Clasp installation is deferred because the current dependency graph introduced audit findings.",
        "files": [
            "src/tool/workspace-build/runner.ts",
            ".github/workflows/validate.yml",
            "SETUP.md"
        ]
    },
    {
        "id": "ADR-003",
        "title": "Persist immutable release events and separate source from record commits",
        "date": "2026-11-02",
        "status": "Accepted",
        "context": "A per-extension locked JSON history preserves candidates, failures, verified publication, and rollback without replacing artifact identity. Sequence reservations include failed candidates. Only a trusted remote verifier can mark production. The CLI provides inspection until real product adapters exist.",
        "files": [
            "src/tool/workspace-build/release.ts",
            "src/tool/workspace-build/release-store.ts",
            "releases/README.md"
        ]
    }
]
