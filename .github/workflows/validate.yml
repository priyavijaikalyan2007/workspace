# PURPOSE: Run the native local contract on Ubuntu without Google credentials.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUILD_NUMBER: ci.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Select the pinned npm version
        run: npm install --global npm@11.20.0
      - name: Install the shared lockfile
        run: npm ci
      - name: Check current dependency advisories
        run: npm audit --audit-level=moderate
      - name: Validate, build, and package the local fixture
        run: ./package.sh --fixture
      - name: Build shared tooling and report planned extensions
        run: ./build.sh
